[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "road-log"
version = "1.0.0"
description = "Digital twin of a truck tachograph fleet with live MQTT telemetry and EU driving-time rules"
readme = "README.md"
license = "MIT"
authors = [{ name = "Cristian Gil Sanz" }, { name = "Paola Herráez Bravo" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "paho-mqtt>=2.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
road-log = "roadlog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roadlog = ["data/*.json.gz", "dashboard/static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.ruff.lint.isort]
known-local-folder = ["conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
