<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>road-log · Live Fleet</title>
  <link rel="icon" href="static/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <div id="map"></div>
  <div id="panel" hidden>
    <div class="panel-head">
      <div>
        <div id="panel-title"></div>
        <div id="panel-subtitle"></div>
      </div>
      <button id="panel-close" aria-label="Close">×</button>
    </div>
    <div id="panel-summary"></div>
    <nav class="tabs">
      <button data-tab="telemetry" class="active">Telemetry</button>
      <button data-tab="events">Events</button>
      <button data-tab="config">Config</button>
    </nav>
    <div class="tab" id="tab-telemetry">
      <canvas id="speed-chart" width="340" height="120"></canvas>
      <div class="legend"><span class="gnss">GNSS</span><span class="odometer">Odometer</span><span>last minute</span></div>
      <table>
        <thead><tr><th>Time</th><th>GNSS</th><th>Odometer</th><th>Driver</th><th>Activity</th></tr></thead>
        <tbody id="telemetry-rows"></tbody>
      </table>
    </div>
    <div class="tab" id="tab-events" hidden>
      <div id="vehicle-events"></div>
    </div>
    <div class="tab" id="tab-config" hidden>
      <form id="config-form">
        <label>Telemetry rate (seconds)<input name="telemetry_interval" type="number" min="0.2" max="60" step="0.1" required></label>
        <label>Sensor sampling rate (seconds)<input name="sampling_interval" type="number" min="0.2" max="60" step="0.1" required></label>
        <button type="submit">Assign</button>
        <p id="config-result"></p>
      </form>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="static/app.js"></script>
</body>
</html>
